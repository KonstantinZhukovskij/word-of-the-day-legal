<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Word Widget</title><link rel="icon" href="./icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet"><style>:root{--bg:#F1F3F7;--surface:#fff;--line:rgba(16,19,26,.1);--text:#10131A;--sub:#3D4553;--meta:#566070;--accent:#0B6B63;--soft:rgba(11,107,99,.12);--on:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0E1015;--surface:#171B22;--line:rgba(255,255,255,.1);--text:#F3F5F9;--sub:#BAC2D0;--meta:#8F99AB;--accent:#5FD0C3;--soft:rgba(95,208,195,.16);--on:#0B1F1D}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:17px/1.6 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:24px 24px 64px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:32px}
.brand{display:flex;align-items:center;gap:12px;color:var(--text);text-decoration:none;font-weight:600}
.brand img{width:40px;height:40px;border-radius:10px}
.langs{display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.langs a{padding:6px 14px;border-radius:11px;color:var(--sub);text-decoration:none;font-size:14px;font-weight:600}
.langs a[aria-current=page]{background:var(--accent);color:var(--on)}
h1{font:600 34px/1.15 "Source Serif 4",Georgia,serif;letter-spacing:-.01em;margin:0 0 12px}
.date{display:inline-block;padding:4px 12px;border-radius:14px;background:var(--soft);color:var(--accent);font-size:14px;font-weight:600;margin:0 0 20px}
.lead{color:var(--sub);margin:0 0 24px}
section{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 24px;margin:0 0 16px}
h2{font:600 20px/1.3 "Source Serif 4",Georgia,serif;margin:0 0 8px}
p{margin:0 0 12px;color:var(--sub)}p:last-child{margin-bottom:0}
ul{margin:0;padding-left:20px;color:var(--sub)}li{margin:4px 0}
a{color:var(--accent)}strong{color:var(--text)}
.hero{padding:16px 0 24px}.hero img{width:88px;height:88px;border-radius:22px;margin-bottom:20px}
.links a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;margin:0 0 12px;background:var(--surface);border:1px solid var(--line);border-radius:20px;color:var(--text);text-decoration:none;font-weight:600}
.links a:after{content:"\203A";color:var(--meta);font-size:24px}
footer{margin-top:32px;color:var(--meta);font-size:14px}</style></head><body><main><div class="top"><a class="brand" href="./"><img src="./icon.png" alt="">Daily Word Widget</a></div><div class="hero"><img src="icon.png" alt=""><h1>Daily Word Widget</h1><p class="lead">A new word every day, right on your home screen and lock screen. No account, works offline, 14 languages.</p></div><div class="links"><a href="privacy/">Privacy Policy</a><a href="terms/">Terms of Use</a><a href="privacy/ru/">Политика конфиденциальности</a><a href="terms/ru/">Условия использования</a></div><footer>© 2026 Konstantin Zhukovskij</footer></main></body></html>
